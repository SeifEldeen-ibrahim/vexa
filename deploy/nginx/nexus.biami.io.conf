# Vexa/Nexus Terminal — TLS reverse proxy for nexus.biami.io
#
# TRACKED COPY of the live config at /etc/nginx/sites-enabled/nexus.biami.io.conf. Edit this file,
# then install it:
#
#   sudo cp deploy/nginx/nexus.biami.io.conf /etc/nginx/sites-enabled/nexus.biami.io.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TWO things are exposed, and nothing else. The Terminal (127.0.0.1:13000) is already a full
# front door:
#   /api/*  -> its own catch-all proxy -> gateway:8000 (injects the per-user X-API-Key server-side)
#   /ws     -> server.mjs WebSocket proxy -> gateway (the browser connects KEYLESS, same-origin)
# And the Nexus live lane (127.0.0.1:18120), for in-person calls from the Chrome extension:
#   /live/* -> nexus-live REST + the /live/ingest microphone WebSocket. It authenticates each
#              request itself against admin-api's internal oracle, so the only credential that
#              reaches it is the per-user Nexus API token (see that location block below).
# gateway (18056), admin-api (18057), agent-api (18100), minio and postgres all stay on loopback.
# Publishing any of them would hand out an unauthenticated admin edge.
#
# HTTPS only, as seen by the browser. Port 80 stays open for exactly two reasons: the ACME
# challenge, and Cloudflare's "Flexible" SSL mode, which fetches the origin over plain :80 even
# though the visitor is on HTTPS. A blanket 80->443 redirect would be an infinite loop under
# Flexible, so the redirect below fires on the VISITOR's protocol (CF-Visitor / X-Forwarded-Proto),
# not on the origin's listener. Every real browser request ends up on HTTPS in every zone mode.

# 1 = this request reached us over plaintext AND the visitor was really on http -> redirect.
# "http:https" is the Flexible-mode case: origin leg is :80 but the browser is already secure.
# "http:" (no header) is a direct hit on the origin IP, bypassing Cloudflare -> redirect too.
# WebSocket upgrades on /live/: send `Connection: upgrade` ONLY when the client actually asked for
# one, so the REST calls on the same prefix keep using keep-alive. The standard nginx idiom.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map "$scheme:$http_x_forwarded_proto" $redirect_to_https {
    default      0;
    "http:"      1;
    "http:http"  1;
}

server {
    listen 80  default_server;
    listen [::]:80 default_server;
    # `listen ... http2` rather than the standalone `http2 on;` directive — this host runs
    # nginx 1.24 (Ubuntu 24.04) and the standalone form only exists from 1.25.1.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name nexus.biami.io;

    ssl_certificate     /etc/letsencrypt/live/nexus.biami.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.biami.io/privkey.pem;
    # Inlined rather than `include /etc/letsencrypt/options-ssl-nginx.conf` — that file is written
    # by certbot's *nginx installer*, and we issue with `certonly --webroot`, so it may not exist.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare-aware client IPs, so logs see the visitor and not the edge.
    # Regenerate when Cloudflare rotates its ranges: sudo /usr/local/bin/cf-ips.sh
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Two years, preload-eligible. Only safe because every path below is HTTPS-terminated.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Meeting recordings (webm) stream out through /api/*; the 1m default would truncate them.
    client_max_body_size 512m;

    # ACME HTTP-01 — never redirected. Cloudflare exempts this exact prefix from "Always Use
    # HTTPS", so issuance and renewal validate through the orange cloud with no dashboard
    # change and no API token.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # The OAuth dance must never touch a cache. NextAuth round-trips a one-shot `state` through a
    # cookie and the redirect query, and compares them at the callback; a cached authorize redirect
    # replays a stale state against a fresh cookie and every sign-in dies with "state mismatch".
    # Cloudflare does not cache extensionless dynamic paths by default, but a zone-level Cache Rule
    # or "Cache Everything" page rule would, and the failure looks exactly like a client bug.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        # Tells Cloudflare and the browser alike, whatever the zone config says.
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    # The WebSocket seam. server.mjs intercepts the upgrade on /ws and opens its own socket to
    # the gateway; without these headers the handshake never reaches it and the meetings list
    # freezes at its last REST snapshot (no live meeting.status frames arrive).
    location /ws {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The Nexus LIVE lane — in-person calls from the Nexus Chrome extension (`nexus-live`,
    # 127.0.0.1:18120). This prefix carries both the extension's REST control plane
    # (start / stop / poll / history / checklists) and the microphone WebSocket at /live/ingest.
    #
    # Exposing it is safe on the same terms as the terminal: the service authenticates every
    # request itself against admin-api's internal oracle (the same door the gateway uses), so the
    # only credential that ever reaches it is the per-user Nexus API token the terminal's Google
    # sign-in mints. The gateway, admin-api, agent-api, meeting-api, MinIO and Postgres all stay
    # on loopback.
    #
    # The trailing slash on proxy_pass strips the /live prefix, so the service sees /sessions,
    # /ingest and so on (it tolerates either form).
    #
    # The upgrade headers are load-bearing: without them the audio socket never becomes a
    # WebSocket, and a call then connects, sends nothing, and silently records an empty meeting.
    # The token rides the Sec-WebSocket-Protocol handshake header (a browser cannot set headers
    # on a WebSocket), which is why that header must be forwarded and why there is no ?token= in
    # the URL — a query-string credential would land in this access log.
    location /live/ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:18120/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A meeting runs for hours, so the audio socket must outlive nginx's default 60s idle
        # window; buffering would also hold back the live checklist updates.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth builds the Google callback URL from these. The browser is always on HTTPS
        # (Cloudflare terminates TLS), so this is https even when Cloudflare fetched us on :80 —
        # get it wrong and the OAuth round-trip redirects to http:// and the login never lands.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # /api/chat and /api/meeting/stream are SSE. Buffering holds the whole stream until the
        # turn ends, so the agent reply and the live transcript arrive as one late lump.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
